server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # React Router routes should always load the SPA shell on refresh/deep links.
  location ~ ^/(welcome|verify-otp|terms|language|voice-registration|listening|home|profile|admin)(/.*)?$ {
    try_files /index.html =404;
  }

  # SPA fallback for React Router
  location / {
    try_files $uri /index.html;
  }

  # Cache static assets aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
